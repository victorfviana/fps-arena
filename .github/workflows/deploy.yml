name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissoes minimas para o deploy oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; um push novo nao cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # O gate de verificacao roda antes do build: nada quebrado e publicado.
      - name: Testes
        run: npm test

      - name: Typecheck e build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
