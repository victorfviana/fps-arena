<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Arena</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
      body { font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; }

      #canvas { display: block; width: 100%; height: 100%; cursor: none; }

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        text-align: center;
        background: rgba(10, 10, 12, 0.92);
        color: #e8e4dc;
        z-index: 10;
      }
      #overlay[hidden] { display: none; }
      #overlay h1 {
        font-size: clamp(1.75rem, 6vw, 3rem);
        letter-spacing: 0.28em;
        font-weight: 700;
        text-transform: uppercase;
      }
      #overlay p { color: #8f8a80; line-height: 1.7; font-size: 0.9rem; }
      #overlay kbd {
        display: inline-block;
        padding: 0.15em 0.5em;
        border: 1px solid #3a3630;
        border-radius: 3px;
        background: #1a1815;
        color: #c9c3b8;
      }
      #start {
        justify-self: center;
        margin-top: 0.5rem;
        padding: 0.85rem 2.5rem;
        font: inherit;
        font-size: 0.85rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #0a0a0c;
        background: #c8703c;
        border: 0;
        border-radius: 2px;
        cursor: pointer;
      }
      #start:hover { background: #dd8148; }
      #start:focus-visible { outline: 2px solid #e8e4dc; outline-offset: 3px; }

      /* Diagnostico: numeros que a rubrica de qualidade le. */
      #stats {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 5;
        padding: 6px 9px;
        font-size: 11px;
        line-height: 1.5;
        color: #7fd18f;
        background: rgba(10, 10, 12, 0.55);
        border-left: 2px solid #7fd18f;
        white-space: pre;
        pointer-events: none;
      }
      #stats[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <pre id="stats" hidden></pre>

    <div id="overlay">
      <h1>FPS Arena</h1>
      <p>
        <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> mover &middot;
        <kbd>Shift</kbd> correr &middot; mouse olhar<br />
        <kbd>Esc</kbd> libera o cursor &middot; <kbd>F3</kbd> diagnostico
      </p>
      <button id="start" type="button">Clique para jogar</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
